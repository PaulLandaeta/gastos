# Feature 006 (FR-013): manual production deploy (same steps as `pnpm deploy:prod`).
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.gcp-sa.json
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Credentials and web configuration (never printed)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > .gcp-sa.json
          cat > apps/web/.env.production <<ENV
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_URL=${{ vars.VITE_API_URL }}
          VITE_RECEIPTS_ORIGIN=${{ vars.VITE_RECEIPTS_ORIGIN }}
          VITE_USE_EMULATORS=false
          ENV
          sed -i 's/^ *//' apps/web/.env.production
      - name: Deploy
        run: ALLOW_DIRTY=1 bash scripts/deploy.sh
      - name: Remove credentials
        if: always()
        run: rm -f .gcp-sa.json apps/web/.env.production
